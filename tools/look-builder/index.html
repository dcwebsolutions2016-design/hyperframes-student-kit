<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Look builder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Fraunces:ital,wght@0,300;0,900;1,900&family=Archivo:wght@400;500;700&family=Playfair+Display:wght@700&family=Caveat:wght@700&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&family=Space+Mono&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><b>Your look</b><span>Monte o look passo a passo. Cada passo usa o que você escolheu antes.</span></div>
  <nav class="steps" id="steps"></nav>
  <div class="tabs"><button class="tab on" data-view="look">Look</button><button class="tab" data-view="json">JSON</button></div>
</header>

<main class="main">
  <aside class="preview">
    <div class="clip-row">
      <select id="clipSelect"><option value="">Carregando clipes…</option></select>
      <input id="clipPath" placeholder="ou cole o caminho de um .mp4/.mov" spellcheck="false">
      <button id="clipLoad" class="btn sm">Abrir</button>
    </div>
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <div class="cam" id="cam"><video id="video" muted playsinline preload="auto"></video></div>
        <div class="world" id="world"></div>
        <div class="guides" id="guides"><i class="g head"></i><i class="g cap"></i><i class="g safe"></i></div>
      </div>
    </div>
    <div class="transport">
      <button class="btn sm" id="back5">-5s</button>
      <button class="btn sm primary" id="play">Play</button>
      <button class="btn sm" id="fwd5">+5s</button>
      <span class="time" id="time">0:00 / 0:00</span>
      <label class="chk"><input type="checkbox" id="mute" checked> mudo</label>
      <label class="chk"><input type="checkbox" id="showGuides" checked> guias</label>
    </div>
    <div class="sliders">
      <label>Topo da cabeça <input type="range" id="headTop" min="200" max="1200" step="10"><output id="headTopV"></output></label>
      <label>Legenda (topo) <input type="range" id="capTop" min="600" max="1700" step="10"><output id="capTopV"></output></label>
    </div>
    <details class="texts">
      <summary>Texto de exemplo</summary>
      <label>Gancho, linha 1 <input id="hook1"></label>
      <label>Gancho, linha 2 <input id="hook2"></label>
      <label>Frase das legendas <input id="wordsIn"></label>
      <label>Palavra-chave <input id="keyword"></label>
      <label>Nota à mão <input id="note"></label>
      <label>Comentário <input id="comment"></label>
      <label>Seu @ <input id="user"></label>
      <button class="btn sm" id="fromTranscript">Usar a transcrição do projeto</button>
    </details>
    <p class="hint" id="previewHint">Previewing: <span id="clipName">—</span></p>
  </aside>

  <section class="panel" id="panel">
    <div class="step-head">
      <h2 id="stepTitle">Passo 1 de 7</h2>
      <p id="stepHelp"></p>
      <div class="quick" id="quick"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="json-view" id="jsonView" hidden><pre id="jsonPre"></pre></div>
  </section>
</main>

<footer class="bottom">
  <button class="btn" id="prev">Voltar</button>
  <span class="extras" id="extras">0 extras</span>
  <span class="save-row">
    <input id="slug" placeholder="slug do projeto (video-projects/…)" spellcheck="false">
    <button class="btn" id="save">Salvar look.json</button>
    <button class="btn" id="copyPrompt">Copiar prompt</button>
  </span>
  <button class="btn primary" id="next">Próximo</button>
</footer>
<div class="toast" id="toast"></div>

<script src="/vendor/gsap.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
